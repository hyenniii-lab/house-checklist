<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="임장 체크">
<title>임장 체크리스트</title>
<style>
  :root {
    --green: #1D9E75;
    --green-light: #E1F5EE;
    --green-dark: #0F6E56;
    --amber: #EF9F27;
    --red: #E24B4A;
    --red-light: #FCEBEB;
    --gray-50: #F8F8F7;
    --gray-100: #F1EFE8;
    --gray-200: #D3D1C7;
    --gray-400: #888780;
    --gray-600: #5F5E5A;
    --gray-900: #1A1A18;
    --border: #E5E4DE;
    --radius: 12px;
    --radius-sm: 8px;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  body { font-family: -apple-system, BlinkMacSystemFont, 'Helvetica Neue', sans-serif; background: var(--gray-50); color: var(--gray-900); font-size: 15px; min-height: 100vh; }

  /* Header */
  .header { background: #fff; border-bottom: 1px solid var(--border); padding: 14px 16px 0; position: sticky; top: 0; z-index: 100; }
  .header-top { display: flex; align-items: center; justify-content: space-between; margin-bottom: 12px; }
  .header-title { font-size: 18px; font-weight: 600; }
  .sync-status { font-size: 12px; color: var(--gray-400); display: flex; align-items: center; gap: 4px; }
  .sync-dot { width: 7px; height: 7px; border-radius: 50%; background: var(--gray-200); }
  .sync-dot.ok { background: var(--green); }
  .sync-dot.err { background: var(--red); }

  /* Tabs */
  .tabs { display: flex; gap: 0; }
  .tab { flex: 1; padding: 10px 4px; text-align: center; font-size: 13px; font-weight: 500; color: var(--gray-400); border-bottom: 2px solid transparent; cursor: pointer; transition: all 0.15s; }
  .tab.active { color: var(--green); border-bottom-color: var(--green); }

  /* Views */
  .view { display: none; padding: 16px; }
  .view.active { display: block; }

  /* Property list */
  .prop-card { background: #fff; border-radius: var(--radius); border: 1px solid var(--border); margin-bottom: 10px; overflow: hidden; }
  .prop-card.expanded { border-color: var(--green); }
  .prop-header { display: flex; align-items: center; gap: 10px; padding: 14px; cursor: pointer; }
  .prop-num { width: 28px; height: 28px; border-radius: 50%; background: var(--green); color: #fff; display: flex; align-items: center; justify-content: center; font-size: 12px; font-weight: 600; flex-shrink: 0; }
  .prop-info { flex: 1; min-width: 0; }
  .prop-name { font-weight: 600; font-size: 15px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .prop-sub { font-size: 12px; color: var(--gray-400); margin-top: 2px; }
  .prop-right { display: flex; align-items: center; gap: 8px; flex-shrink: 0; }
  .score-pill { font-size: 12px; font-weight: 600; padding: 3px 8px; border-radius: 20px; background: var(--green-light); color: var(--green-dark); }
  .score-pill.low { background: var(--red-light); color: var(--red); }
  .chevron { font-size: 18px; color: var(--gray-400); transition: transform 0.2s; }
  .chevron.open { transform: rotate(180deg); }

  .prop-body { border-top: 1px solid var(--border); }

  /* Meta fields */
  .meta-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; padding: 14px; border-bottom: 1px solid var(--border); }
  .meta-grid.three { grid-template-columns: 1fr 1fr 1fr; }
  .field label { font-size: 11px; color: var(--gray-400); font-weight: 500; display: block; margin-bottom: 4px; }
  .field input { width: 100%; padding: 9px 10px; border: 1px solid var(--border); border-radius: var(--radius-sm); font-size: 14px; background: var(--gray-50); color: var(--gray-900); -webkit-appearance: none; }
  .field input:focus { outline: none; border-color: var(--green); background: #fff; }

  /* Sections */
  .section-block { border-bottom: 1px solid var(--border); }
  .section-block:last-of-type { border-bottom: none; }
  .section-hd { display: flex; align-items: center; gap: 10px; padding: 13px 14px; cursor: pointer; background: var(--gray-50); }
  .section-icon { font-size: 16px; }
  .section-title-text { flex: 1; font-weight: 600; font-size: 14px; }
  .section-prog { font-size: 12px; color: var(--gray-400); }
  .prog-bar { height: 3px; background: var(--border); }
  .prog-fill { height: 100%; background: var(--green); transition: width 0.3s; }

  .check-items { padding: 4px 0; }
  .check-row { display: flex; align-items: flex-start; gap: 12px; padding: 12px 14px; cursor: pointer; active-background: var(--gray-50); }
  .check-row:active { background: var(--gray-50); }
  .check-box { width: 22px; height: 22px; border-radius: 6px; border: 2px solid var(--border); display: flex; align-items: center; justify-content: center; flex-shrink: 0; margin-top: 1px; transition: all 0.15s; }
  .check-box.checked { background: var(--green); border-color: var(--green); }
  .check-box.checked::after { content: '✓'; color: #fff; font-size: 13px; font-weight: 700; }
  .check-text { font-size: 14px; line-height: 1.5; flex: 1; }
  .check-text.done { color: var(--gray-400); text-decoration: line-through; }
  .must-tag { display: inline-block; font-size: 10px; font-weight: 600; padding: 1px 5px; border-radius: 4px; background: var(--red-light); color: var(--red); margin-left: 5px; vertical-align: middle; }

  /* Rating */
  .rating-section { padding: 12px 14px; border-top: 1px solid var(--border); }
  .rating-label { font-size: 12px; color: var(--gray-400); font-weight: 500; margin-bottom: 8px; }
  .stars { display: flex; gap: 6px; }
  .star { font-size: 28px; color: var(--border); cursor: pointer; transition: color 0.1s; }
  .star.on { color: var(--amber); }

  /* Note */
  .note-section { padding: 12px 14px; border-top: 1px solid var(--border); }
  .note-section label { font-size: 12px; color: var(--gray-400); font-weight: 500; display: block; margin-bottom: 6px; }
  .note-section textarea { width: 100%; padding: 10px; border: 1px solid var(--border); border-radius: var(--radius-sm); font-size: 14px; background: var(--gray-50); color: var(--gray-900); resize: none; min-height: 72px; font-family: inherit; }
  .note-section textarea:focus { outline: none; border-color: var(--green); background: #fff; }

  /* Delete btn */
  .delete-btn { display: flex; align-items: center; justify-content: center; gap: 6px; width: calc(100% - 28px); margin: 14px; padding: 11px; border: 1px solid var(--red-light); border-radius: var(--radius-sm); background: transparent; color: var(--red); font-size: 14px; cursor: pointer; }
  .delete-btn:active { background: var(--red-light); }

  /* Add button */
  .add-btn { display: flex; align-items: center; justify-content: center; gap: 8px; width: 100%; padding: 15px; border: 2px dashed var(--green); border-radius: var(--radius); background: transparent; color: var(--green); font-size: 15px; font-weight: 600; cursor: pointer; margin-bottom: 20px; }
  .add-btn:active { background: var(--green-light); }

  /* Compare view */
  .cmp-chips { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 14px; }
  .cmp-chip { padding: 7px 14px; border: 1px solid var(--border); border-radius: 20px; font-size: 13px; cursor: pointer; background: #fff; color: var(--gray-600); }
  .cmp-chip.sel { background: var(--green); color: #fff; border-color: var(--green); }
  .cmp-hint { font-size: 13px; color: var(--gray-400); margin-bottom: 12px; }

  .cmp-card { background: #fff; border-radius: var(--radius); border: 1px solid var(--border); margin-bottom: 10px; overflow: hidden; }
  .cmp-card-header { padding: 12px 14px; background: var(--gray-50); border-bottom: 1px solid var(--border); }
  .cmp-card-title { font-weight: 600; font-size: 14px; }
  .cmp-row { display: flex; align-items: center; padding: 10px 14px; border-bottom: 1px solid var(--border); }
  .cmp-row:last-child { border-bottom: none; }
  .cmp-row-label { font-size: 12px; color: var(--gray-400); width: 90px; flex-shrink: 0; }
  .cmp-vals { display: flex; flex: 1; gap: 6px; flex-wrap: wrap; }
  .cmp-val { font-size: 13px; padding: 3px 8px; border-radius: 6px; background: var(--gray-100); }
  .cmp-val.best { background: var(--green-light); color: var(--green-dark); font-weight: 600; }

  .sec-compare { padding: 12px 14px; }
  .sec-compare-title { font-size: 12px; color: var(--gray-400); font-weight: 500; margin-bottom: 8px; }
  .sec-row { display: flex; align-items: center; gap: 8px; margin-bottom: 6px; }
  .sec-row-name { font-size: 12px; color: var(--gray-600); width: 90px; flex-shrink: 0; }
  .sec-bars { display: flex; flex: 1; gap: 4px; }
  .sec-bar-wrap { flex: 1; }
  .sec-bar-name { font-size: 10px; color: var(--gray-400); margin-bottom: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .sec-bar-track { height: 6px; background: var(--border); border-radius: 3px; overflow: hidden; }
  .sec-bar-fill { height: 100%; background: var(--green); border-radius: 3px; transition: width 0.3s; }

  /* Empty */
  .empty { text-align: center; padding: 48px 20px; color: var(--gray-400); }
  .empty-icon { font-size: 48px; margin-bottom: 12px; }
  .empty-text { font-size: 15px; }

  /* Toast */
  .toast { position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%); background: var(--gray-900); color: #fff; padding: 10px 18px; border-radius: 20px; font-size: 13px; opacity: 0; transition: opacity 0.3s; pointer-events: none; z-index: 999; white-space: nowrap; }
  .toast.show { opacity: 1; }

  /* Loading */
  .loading { text-align: center; padding: 40px; color: var(--gray-400); font-size: 14px; }
</style>
</head>
<body>

<div class="header">
  <div class="header-top">
    <span class="header-title">🏠 임장 체크리스트</span>
    <span class="sync-status">
      <span class="sync-dot" id="sync-dot"></span>
      <span id="sync-text">연결 중...</span>
    </span>
  </div>
  <div class="tabs">
    <div class="tab active" onclick="switchTab('list')">매물 목록</div>
    <div class="tab" onclick="switchTab('compare')">비교</div>
  </div>
</div>

<div id="view-list" class="view active">
  <div id="prop-list"><div class="loading">불러오는 중...</div></div>
  <button class="add-btn" onclick="addProp()">+ 매물 추가</button>
</div>

<div id="view-compare" class="view">
  <div class="cmp-hint">비교할 매물을 선택하세요 (최대 4개)</div>
  <div class="cmp-chips" id="cmp-chips"></div>
  <div id="cmp-output"></div>
</div>

<div class="toast" id="toast"></div>

<script>
const SUPABASE_URL = 'https://qcrioffspmgvytjnzleq.supabase.co';
const SUPABASE_KEY = 'sb_publishable_q-bcRtMY12tbSnLbmErvQA_LmcrMl11';
const API = `${SUPABASE_URL}/rest/v1/properties`;
const HEADERS = {
  'Content-Type': 'application/json',
  'apikey': SUPABASE_KEY,
  'Authorization': `Bearer ${SUPABASE_KEY}`,
  'Prefer': 'return=representation'
};

const SECTIONS = [
  { icon: '📍', title: '동네 & 외부', items: [
    { t: '밤에 혼자 걸었을 때 치안·분위기', must: true },
    { t: '집까지 가로등·CCTV 여부', must: true },
    { t: '주변 소음원 (도로·술집·24시 식당)', must: true },
    { t: '도보 편의점·코인세탁소·수선집' },
    { t: '지하철·버스 실제 도보 거리·경사' },
    { t: '건물 주변 유흥업소·악취 여지' },
    { t: '1층 상가 업종 확인' },
  ]},
  { icon: '🏢', title: '건물 공용', items: [
    { t: '공동 현관 자동잠금·비밀번호', must: true },
    { t: 'CCTV — 출입구·복도·엘리베이터' },
    { t: '무인 택배함 유무' },
    { t: '분리수거 장소·배출 요일' },
    { t: '관리자 상주 여부' },
  ]},
  { icon: '🏠', title: '방 구조', items: [
    { t: '실면적 10평대 이상 확인', must: true },
    { t: '1.5룸·투룸 또는 공간 분리 구조', must: true },
    { t: '세탁기 공간 별도 분리', must: true },
    { t: '이중창 여부' },
    { t: '창문-문 일직선 환기 구조' },
    { t: '창문 외부 시선 노출 여부' },
    { t: '옆 건물 채광·사생활 확인' },
    { t: '1층·반지하 여부 → 피하기' },
    { t: '인덕션 전용(가스 없음) 여부' },
  ]},
  { icon: '🚿', title: '화장실 (최우선)', items: [
    { t: '청결도·곰팡이·물때', must: true },
    { t: '샤워부스 분리 또는 공간 여유', must: true },
    { t: '배수구 냄새 (문 닫고 확인)', must: true },
    { t: '물 밖으로 새지 않는 구조' },
    { t: '환풍기 작동 여부' },
    { t: '결로·습도 흔적' },
  ]},
  { icon: '💧', title: '수도 & 배관', items: [
    { t: '온수 속도·온도', must: true },
    { t: '수압 — 세면대+변기 동시 확인', must: true },
    { t: '세면대·싱크대·변기 배수' },
  ]},
  { icon: '🌫️', title: '곰팡이 & 단열', items: [
    { t: '벽 모서리·창틀 곰팡이', must: true },
    { t: '이중창 여부' },
    { t: '북향·반지하 여부' },
    { t: '페인트 들뜸·얼룩 (누수 이력)' },
  ]},
  { icon: '⚡', title: '전기·가스·인터넷', items: [
    { t: '도시가스 여부', must: true },
    { t: '인터넷 설치 여부·공유기 위치' },
    { t: '콘센트 위치·개수' },
    { t: '전기 계량기 개별 vs 공용' },
  ]},
  { icon: '🔊', title: '소음 & 방음', items: [
    { t: '벽 두드려보기 (속이 빈지)' },
    { t: '창문 닫고 외부 소음 체감' },
    { t: '위층·옆집 소음 세입자에게 문의' },
  ]},
  { icon: '💰', title: '비용 & 계약', items: [
    { t: '관리비 항목 상세 확인', must: true },
    { t: '총 월 지출 (월세+관리비+공과금)', must: true },
    { t: '보증금↑ 월세↓ 협상 가능 여부' },
    { t: '겨울 난방비 세입자에게 문의' },
    { t: '여름 에어컨 전기료 확인' },
  ]},
  { icon: '📋', title: '등기부등본', items: [
    { t: '등기부등본 발급 확인', must: true },
    { t: '근저당 금액 과다 여부', must: true },
    { t: '압류·가압류·경매 없는지', must: true },
    { t: '가등기·임차권등기명령 없는지', must: true },
    { t: '건물 용도 (근린생활시설 주의)' },
    { t: '임대인 = 등기부 소유자 일치', must: true },
  ]},
  { icon: '🤝', title: '집주인 & 세입자', items: [
    { t: '집주인 대응 세입자에게 문의' },
    { t: '하자 수리 대응 빠른지 확인' },
    { t: '공과금 월 평균 확인' },
    { t: '퇴실 원상복구 범위 확인' },
    { t: '인테리어 가능 여부 확인' },
  ]},
];

const TOTAL = SECTIONS.reduce((a, s) => a + s.items.length, 0);

let props = [];
let secOpen = {};
let cmpSel = [];
let saveTimers = {};

function uid() { return Date.now().toString(36) + Math.random().toString(36).slice(2, 6); }

function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 2000);
}

function setSyncStatus(ok, text) {
  document.getElementById('sync-dot').className = 'sync-dot ' + (ok === true ? 'ok' : ok === false ? 'err' : '');
  document.getElementById('sync-text').textContent = text;
}

async function loadProps() {
  try {
    const r = await fetch(`${API}?order=created_at.asc`, { headers: HEADERS });
    if (!r.ok) throw new Error();
    props = await r.json();
    props.forEach(p => { if (!p.checks) p.checks = {}; });
    setSyncStatus(true, '동기화됨');
    renderList();
    renderCompare();
  } catch {
    setSyncStatus(false, '오프라인');
    props = JSON.parse(localStorage.getItem('props') || '[]');
    renderList();
    showToast('오프라인 — 로컬 데이터 사용 중');
  }
}

async function addProp() {
  const n = props.length + 1;
  const p = { id: uid(), name: `매물 ${n}`, deposit: '', monthly: '', mgmt: '', area: '', floor: '', checks: {}, note: '', rating: 0 };
  props.push(p);
  secOpen[p.id] = {};
  try {
    await fetch(API, { method: 'POST', headers: HEADERS, body: JSON.stringify({ ...p, checks: JSON.stringify(p.checks) }) });
    setSyncStatus(true, '동기화됨');
  } catch { setSyncStatus(false, '저장 실패'); }
  saveLocal();
  renderList();
  setTimeout(() => {
    const el = document.getElementById('ph-' + p.id);
    if (el) el.scrollIntoView({ behavior: 'smooth', block: 'start' });
  }, 100);
}

async function deleteProp(id) {
  if (!confirm('이 매물을 삭제할까요?')) return;
  props = props.filter(p => p.id !== id);
  cmpSel = cmpSel.filter(i => i !== id);
  try {
    await fetch(`${API}?id=eq.${id}`, { method: 'DELETE', headers: HEADERS });
    setSyncStatus(true, '동기화됨');
  } catch { setSyncStatus(false, '삭제 실패'); }
  saveLocal();
  renderList();
  renderCompare();
}

function scheduleSave(p) {
  if (saveTimers[p.id]) clearTimeout(saveTimers[p.id]);
  saveTimers[p.id] = setTimeout(() => saveProp(p), 800);
}

async function saveProp(p) {
  saveLocal();
  try {
    await fetch(`${API}?id=eq.${p.id}`, {
      method: 'PATCH',
      headers: HEADERS,
      body: JSON.stringify({ ...p, checks: JSON.stringify(p.checks), updated_at: new Date().toISOString() })
    });
    setSyncStatus(true, '동기화됨');
  } catch { setSyncStatus(false, '저장 실패'); }
}

function saveLocal() {
  try { localStorage.setItem('props', JSON.stringify(props)); } catch {}
}

function getScore(p) {
  const done = Object.values(p.checks || {}).filter(Boolean).length;
  return TOTAL ? Math.round(done / TOTAL * 100) : 0;
}

function getSecScore(p, si) {
  const items = SECTIONS[si].items;
  const done = items.filter((_, ii) => (p.checks || {})[`${si}-${ii}`]).length;
  return { done, total: items.length, pct: Math.round(done / items.length * 100) };
}

function switchTab(name) {
  document.querySelectorAll('.tab').forEach((t, i) => t.classList.toggle('active', ['list','compare'][i] === name));
  document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));
  document.getElementById('view-' + name).classList.add('active');
  if (name === 'compare') renderCompare();
}

function toggleExpand(id) {
  const el = document.getElementById('pb-' + id);
  const ch = document.getElementById('ch-' + id);
  const card = document.getElementById('ph-' + id);
  if (!el) return;
  const open = el.style.display !== 'none';
  el.style.display = open ? 'none' : 'block';
  if (ch) ch.className = 'chevron' + (open ? '' : ' open');
  if (card) card.classList.toggle('expanded', !open);
}

function toggleSection(pid, si) {
  if (!secOpen[pid]) secOpen[pid] = {};
  secOpen[pid][si] = !secOpen[pid][si];
  const el = document.getElementById(`si-${pid}-${si}`);
  const ch = document.getElementById(`sch-${pid}-${si}`);
  if (el) el.style.display = secOpen[pid][si] ? 'block' : 'none';
  if (ch) ch.style.transform = secOpen[pid][si] ? 'rotate(180deg)' : 'none';
}

function toggleCheck(pid, si, ii) {
  const p = props.find(x => x.id === pid);
  if (!p) return;
  if (!p.checks) p.checks = {};
  const k = `${si}-${ii}`;
  p.checks[k] = !p.checks[k];
  const box = document.getElementById(`ck-${pid}-${si}-${ii}`);
  const txt = document.getElementById(`ct-${pid}-${si}-${ii}`);
  if (box) { box.className = 'check-box' + (p.checks[k] ? ' checked' : ''); }
  if (txt) { txt.className = 'check-text' + (p.checks[k] ? ' done' : ''); }
  updateScoreDisplay(p);
  scheduleSave(p);
}

function updateScoreDisplay(p) {
  const sc = getScore(p);
  const pill = document.getElementById('sp-' + p.id);
  if (pill) {
    pill.textContent = sc + '%';
    pill.className = 'score-pill' + (sc < 30 ? ' low' : '');
  }
  SECTIONS.forEach((sec, si) => {
    const ss = getSecScore(p, si);
    const fill = document.getElementById(`sf-${p.id}-${si}`);
    const prog = document.getElementById(`sp2-${p.id}-${si}`);
    if (fill) fill.style.width = ss.pct + '%';
    if (prog) prog.textContent = `${ss.done}/${ss.total}`;
  });
}

function updateField(pid, field, val) {
  const p = props.find(x => x.id === pid);
  if (!p) return;
  p[field] = val;
  if (field === 'name') {
    const nameEl = document.getElementById('pname-' + pid);
    if (nameEl) nameEl.textContent = val || '이름 없음';
  }
  scheduleSave(p);
}

function setRating(pid, r) {
  const p = props.find(x => x.id === pid);
  if (!p) return;
  p.rating = r;
  for (let i = 1; i <= 5; i++) {
    const s = document.getElementById(`star-${pid}-${i}`);
    if (s) s.className = 'star' + (i <= r ? ' on' : '');
  }
  scheduleSave(p);
}

function renderList() {
  const list = document.getElementById('prop-list');
  if (!props.length) {
    list.innerHTML = `<div class="empty"><div class="empty-icon">🏠</div><div class="empty-text">매물을 추가해보세요</div></div>`;
    return;
  }
  list.innerHTML = props.map((p, pi) => {
    const sc = getScore(p);
    const sub = [p.deposit ? '보증금 ' + p.deposit + '만' : '', p.monthly ? '월세 ' + p.monthly + '만' : '', p.area || ''].filter(Boolean).join(' · ');
    return `
<div class="prop-card" id="ph-${p.id}">
  <div class="prop-header" onclick="toggleExpand('${p.id}')">
    <div class="prop-num">${pi + 1}</div>
    <div class="prop-info">
      <div class="prop-name" id="pname-${p.id}">${p.name || '매물 ' + (pi+1)}</div>
      ${sub ? `<div class="prop-sub">${sub}</div>` : ''}
    </div>
    <div class="prop-right">
      <span class="score-pill${sc < 30 ? ' low' : ''}" id="sp-${p.id}">${sc}%</span>
      <span class="chevron" id="ch-${p.id}">›</span>
    </div>
  </div>
  <div class="prop-body" id="pb-${p.id}" style="display:none">
    <div class="meta-grid">
      <div class="field"><label>매물명</label><input value="${p.name || ''}" placeholder="예: 마포 A" oninput="updateField('${p.id}','name',this.value)"></div>
      <div class="field"><label>보증금 (만원)</label><input type="number" value="${p.deposit || ''}" placeholder="예: 3000" oninput="updateField('${p.id}','deposit',this.value)"></div>
      <div class="field"><label>월세 (만원)</label><input type="number" value="${p.monthly || ''}" placeholder="예: 75" oninput="updateField('${p.id}','monthly',this.value)"></div>
      <div class="field"><label>관리비 (만원)</label><input type="number" value="${p.mgmt || ''}" placeholder="예: 10" oninput="updateField('${p.id}','mgmt',this.value)"></div>
    </div>
    <div class="meta-grid three">
      <div class="field"><label>평수</label><input value="${p.area || ''}" placeholder="예: 12평" oninput="updateField('${p.id}','area',this.value)"></div>
      <div class="field"><label>층</label><input value="${p.floor || ''}" placeholder="예: 4층" oninput="updateField('${p.id}','floor',this.value)"></div>
      <div class="field"><label>구조</label><input value="${p.struct || ''}" placeholder="예: 1.5룸" oninput="updateField('${p.id}','struct',this.value)"></div>
    </div>
    ${SECTIONS.map((sec, si) => {
      const ss = getSecScore(p, si);
      return `
<div class="section-block">
  <div class="section-hd" onclick="toggleSection('${p.id}', ${si})">
    <span class="section-icon">${sec.icon}</span>
    <span class="section-title-text">${sec.title}</span>
    <span class="section-prog" id="sp2-${p.id}-${si}">${ss.done}/${ss.total}</span>
    <span style="color:var(--gray-400);margin-left:4px;font-size:16px;transition:transform 0.2s" id="sch-${p.id}-${si}">›</span>
  </div>
  <div class="prog-bar"><div class="prog-fill" style="width:${ss.pct}%" id="sf-${p.id}-${si}"></div></div>
  <div class="check-items" id="si-${p.id}-${si}" style="display:none">
    ${sec.items.map((item, ii) => {
      const checked = !!(p.checks || {})[`${si}-${ii}`];
      return `<div class="check-row" onclick="toggleCheck('${p.id}',${si},${ii})">
        <div class="check-box${checked ? ' checked' : ''}" id="ck-${p.id}-${si}-${ii}"></div>
        <span class="check-text${checked ? ' done' : ''}" id="ct-${p.id}-${si}-${ii}">${item.t}${item.must ? '<span class="must-tag">필수</span>' : ''}</span>
      </div>`;
    }).join('')}
  </div>
</div>`;
    }).join('')}
    <div class="rating-section">
      <div class="rating-label">종합 평점</div>
      <div class="stars">${[1,2,3,4,5].map(r => `<span class="star${p.rating >= r ? ' on' : ''}" id="star-${p.id}-${r}" onclick="setRating('${p.id}',${r})">★</span>`).join('')}</div>
    </div>
    <div class="note-section">
      <label>메모</label>
      <textarea placeholder="특이사항, 느낌, 기억할 것들..." onchange="updateField('${p.id}','note',this.value)">${p.note || ''}</textarea>
    </div>
    <button class="delete-btn" onclick="deleteProp('${p.id}')">🗑 이 매물 삭제</button>
  </div>
</div>`;
  }).join('');
}

function renderCompare() {
  const chips = document.getElementById('cmp-chips');
  if (!chips) return;
  chips.innerHTML = props.map(p => `<div class="cmp-chip${cmpSel.includes(p.id) ? ' sel' : ''}" onclick="toggleCmp('${p.id}')">${p.name || '이름 없음'}</div>`).join('');

  const out = document.getElementById('cmp-output');
  const sel = props.filter(p => cmpSel.includes(p.id));
  if (sel.length < 2) {
    out.innerHTML = `<div class="empty" style="padding:32px 0"><div style="font-size:36px;margin-bottom:10px">📊</div><div class="empty-text">2개 이상 선택하면<br>비교표가 나타납니다</div></div>`;
    return;
  }

  const totalCosts = sel.map(p => (parseInt(p.monthly)||0) + (parseInt(p.mgmt)||0));
  const minCost = Math.min(...totalCosts.filter(c => c > 0));
  const maxScore = Math.max(...sel.map(p => getScore(p)));
  const maxRating = Math.max(...sel.map(p => p.rating));

  out.innerHTML = `
<div class="cmp-card">
  <div class="cmp-card-header"><div class="cmp-card-title">기본 정보 비교</div></div>
  <div class="cmp-row">
    <span class="cmp-row-label">보증금</span>
    <div class="cmp-vals">${sel.map(p => `<span class="cmp-val">${p.name}: ${p.deposit ? p.deposit+'만' : '-'}</span>`).join('')}</div>
  </div>
  <div class="cmp-row">
    <span class="cmp-row-label">월세</span>
    <div class="cmp-vals">${sel.map(p => `<span class="cmp-val">${p.name}: ${p.monthly ? p.monthly+'만' : '-'}</span>`).join('')}</div>
  </div>
  <div class="cmp-row">
    <span class="cmp-row-label">총 월 비용</span>
    <div class="cmp-vals">${sel.map((p, i) => {
      const c = totalCosts[i];
      return `<span class="cmp-val${c === minCost && c > 0 ? ' best' : ''}">${p.name}: ${c > 0 ? c+'만' : '-'}</span>`;
    }).join('')}</div>
  </div>
  <div class="cmp-row">
    <span class="cmp-row-label">체크리스트</span>
    <div class="cmp-vals">${sel.map(p => {
      const sc = getScore(p);
      return `<span class="cmp-val${sc === maxScore ? ' best' : ''}">${p.name}: ${sc}%</span>`;
    }).join('')}</div>
  </div>
  <div class="cmp-row">
    <span class="cmp-row-label">평점</span>
    <div class="cmp-vals">${sel.map(p => `<span class="cmp-val${p.rating === maxRating && p.rating > 0 ? ' best' : ''}">${p.name}: ${'★'.repeat(p.rating) || '-'}</span>`).join('')}</div>
  </div>
  <div class="cmp-row">
    <span class="cmp-row-label">평수/구조</span>
    <div class="cmp-vals">${sel.map(p => `<span class="cmp-val">${p.name}: ${[p.area, p.struct].filter(Boolean).join('/') || '-'}</span>`).join('')}</div>
  </div>
</div>

<div class="cmp-card">
  <div class="cmp-card-header"><div class="cmp-card-title">섹션별 달성률</div></div>
  <div class="sec-compare">
    ${SECTIONS.map((sec, si) => `
<div class="sec-row">
  <span class="sec-row-name">${sec.icon} ${sec.title}</span>
  <div class="sec-bars">${sel.map(p => {
    const ss = getSecScore(p, si);
    return `<div class="sec-bar-wrap">
      <div class="sec-bar-name">${p.name}</div>
      <div class="sec-bar-track"><div class="sec-bar-fill" style="width:${ss.pct}%"></div></div>
    </div>`;
  }).join('')}</div>
</div>`).join('')}
  </div>
</div>

${sel.map(p => `
<div class="cmp-card">
  <div class="cmp-card-header"><div class="cmp-card-title">${p.name} 메모</div></div>
  <div style="padding:12px 14px;font-size:14px;color:${p.note ? 'var(--gray-900)' : 'var(--gray-400)'};">${p.note || '메모 없음'}</div>
</div>`).join('')}
`;
}

function toggleCmp(id) {
  if (cmpSel.includes(id)) {
    cmpSel = cmpSel.filter(i => i !== id);
  } else if (cmpSel.length < 4) {
    cmpSel.push(id);
  } else {
    showToast('최대 4개까지 선택 가능해요');
    return;
  }
  renderCompare();
}

loadProps();
</script>
</body>
</html>
